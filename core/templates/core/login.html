{% extends "base.html" %}

{% block title %}Вход — AskBabenkova{% endblock %}

{% block content %}
    <h1 class="questions-title mb-3">Вход</h1>

    <form class="django-form" action="{% url 'core:login' %}" method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <p class="mt-4">
        Ещё нет аккаунта?
        <a href="{% url 'core:signup' %}">Зарегистрироваться</a>
    </p>
{% endblock %}
