{% extends "base.html" %}

{% block title %}Регистрация — AskBabenkova{% endblock %}

{% block content %}
    <h1 class="questions-title mb-3">Регистрация</h1>

    <form class="django-form" action="{% url 'core:signup' %}" method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-success">Зарегистрироваться</button>
    </form>

    <p class="mt-4">
        Уже есть аккаунт?
        <a href="{% url 'core:login' %}">Войти</a>
    </p>
{% endblock %}
