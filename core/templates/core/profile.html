{% extends "base.html" %}
{% load static %}

{% block title %}Настройки профиля — AskBabenkova{% endblock %}

{% block content %}
    <h1 class="questions-title mb-3">Настройки профиля</h1>

    <img
        src="{% if user.profile.avatar %}{{ user.profile.avatar.url }}{% else %}{% static 'core/img/avatar.svg' %}{% endif %}"
        alt="Текущая аватарка"
        class="avatar mb-3"
        width="64"
        height="64"
    >

    <form class="django-form" action="{% url 'core:profile' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    </form>
{% endblock %}
