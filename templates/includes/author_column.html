{% load static %}

<div class="question-author">
    <img
        src="{% if item.author.profile.avatar %}{{ item.author.profile.avatar.url }}{% else %}{% static 'core/img/avatar.svg' %}{% endif %}"
        alt="Аватар {{ author_name }}"
        class="avatar"
        width="64"
        height="64"
    >

    <div class="vote-widget" role="group" aria-label="{{ vote_label }}">
        <button
            type="button"
            class="vote-button"
            aria-label="Нравится"
            disabled
        >▲</button>

        <span class="vote-count">{{ item.rating }}</span>

        <button
            type="button"
            class="vote-button"
            aria-label="Не нравится"
            disabled
        >▼</button>
    </div>
</div>
