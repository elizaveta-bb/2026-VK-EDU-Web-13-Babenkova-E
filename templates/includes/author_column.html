{% load static %}

<div class="question-author">
    <img
        src="{% static 'core/img/avatar.svg' %}"
        alt="Аватар {{ item.author }}"
        class="avatar"
        width="64"
        height="64"
    >

    <div class="vote-widget" role="group" aria-label="{{ vote_label }}">
        <button
            type="button"
            class="vote-button{% if item.user_vote == 1 %} is-liked{% endif %}"
            aria-label="Нравится"
            aria-pressed="{% if item.user_vote == 1 %}true{% else %}false{% endif %}"
        >▲</button>

        <span class="vote-count">{{ item.rating }}</span>

        <button
            type="button"
            class="vote-button{% if item.user_vote == -1 %} is-disliked{% endif %}"
            aria-label="Не нравится"
            aria-pressed="{% if item.user_vote == -1 %}true{% else %}false{% endif %}"
        >▼</button>
    </div>
</div>
