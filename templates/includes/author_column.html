{% load static %}

<div class="question-author">
    <img
        src="{% if item.author.profile.avatar %}{{ item.author.profile.avatar.url }}{% else %}{% static 'core/img/avatar.svg' %}{% endif %}"
        alt="Аватар {{ author_name }}"
        class="avatar"
        width="64"
        height="64"
    >

    <div class="vote-widget" role="group" aria-label="{{ vote_label }}"
         data-vote-url="{{ vote_url }}" data-target-id="{{ item.pk }}"
         {% if not user.is_authenticated %}title="Войдите, чтобы голосовать"{% endif %}>
        <button type="button" data-value="1"
                class="vote-button{% if item.my_vote == 1 %} is-liked{% endif %}"
                aria-label="Нравится" aria-pressed="{% if item.my_vote == 1 %}true{% else %}false{% endif %}"
                {% if not user.is_authenticated %}disabled title="Войдите, чтобы поставить лайк"{% elif item.my_vote == 1 %}disabled{% endif %}
        >▲</button>

        <span class="vote-count" aria-live="polite">{{ item.rating }}</span>

        <button type="button" data-value="-1"
                class="vote-button{% if item.my_vote == -1 %} is-disliked{% endif %}"
                aria-label="Не нравится" aria-pressed="{% if item.my_vote == -1 %}true{% else %}false{% endif %}"
                {% if not user.is_authenticated %}disabled title="Войдите, чтобы поставить дизлайк"{% elif item.my_vote == -1 %}disabled{% endif %}
        >▼</button>
    </div>
</div>
